name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        numpy: [false]
        include:
          - python: "3.12"
            numpy: true
    name: Python ${{ matrix.python }}${{ matrix.numpy && ' + numpy' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installa numpy (benchmark bit per bit con EMA)
        if: ${{ matrix.numpy }}
        run: python -m pip install numpy
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Installazione del pacchetto
        run: |
          python -m pip install .
          cwm --help
