[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collective-wisdom-model"
version = "1.2.1"
description = "Livello decisionale e di governance per decisioni pubbliche in incertezza: prove, valore dell'informazione, legittimità dei pesi, astensione e audit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "EUPL-1.2"}
authors = [{name = "Cristian Magrini"}]
keywords = ["decision making under deep uncertainty", "robust decision making", "value of information", "AHP", "audit", "EMA Workbench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Natural Language :: Italian",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
benchmark = ["numpy"]

[project.scripts]
cwm = "cwm.__main__:main"

[tool.setuptools]
packages = ["cwm"]

[tool.setuptools.package-data]
cwm = ["ui.html"]
